<!DOCTYPE html>
<html>
<head>
    <title>Project Verification</title>
</head>

<body>

<h1>Project Verification</h1>

<p><strong>Project Name:</strong></p>
<div id="project_name"></div>

<br>

<p><strong>License Number:</strong></p>
<div id="license_number"></div>

<br>

<p><strong>Date Issued:</strong></p>
<div id="date_issued"></div>

<br>

<a id="pdf_link" target="_blank">
    View PDF
</a>

<h2>Verify a PDF</h2>
<label for="verify_pdf">Choose the PDF you want to check</label>
<input id="verify_pdf" type="file" accept=".pdf,application/pdf">
<button id="verify_button" type="button" disabled>Verify PDF</button>
<p id="verify_result" role="status"></p>

<script type="module">

import { createClient }
from 'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(
'https://lyavctuwlyegrnfwqgez.supabase.co',
'sb_publishable_-z5-3a45iAHLC6-cY2UR_w_nz-RB095'
);

const params =
  new URLSearchParams(window.location.search);

const projectId =
  params.get('id');

if(projectId){

    const { data, error } =
      await supabase
        .from('projects')

        .select('project_name, license_number, date_issued, pdf_url, hash')
        .eq('id', projectId)
        .single();

    if(error){

        document.body.innerHTML =
          '<h2>Project Not Found</h2>';

    } else {

        document.getElementById(
          'project_name'
        ).textContent =
          data.project_name;

        document.getElementById(
          'license_number'
        ).textContent =
          data.license_number;

        document.getElementById(
          'date_issued'
        ).textContent =
          data.date_issued;

        document.getElementById(
          'pdf_link'
        ).href =
          data.pdf_url;

const fileInput = document.getElementById('verify_pdf');
const verifyButton = document.getElementById('verify_button');
const result = document.getElementById('verify_result');
const expectedHash = (data.hash ?? '').trim().toLowerCase();

if (!/^[a-f0-9]{64}$/.test(expectedHash)) {
    result.textContent = 'There is no valid SHA-256 fingerprint on file for this project.';
} else {
    fileInput.addEventListener('change', () => {
        result.textContent = '';
        verifyButton.disabled = !fileInput.files.length;
    });

    verifyButton.addEventListener('click', async () => {
        const file = fileInput.files[0];
        if (!file) return;

        verifyButton.disabled = true;
        fileInput.disabled = true;
        result.textContent = 'Checking your PDF…';

        try {
            const digest = await window.crypto.subtle.digest(
                'SHA-256',
                await file.arrayBuffer()
            );
            const actualHash = Array.from(new Uint8Array(digest))
                .map(byte => byte.toString(16).padStart(2, '0'))
                .join('');

            result.textContent = actualHash === expectedHash
                ? 'Verified. This PDF matches the file saved for this project.'
                : 'The PDF does not match the file saved for this project.';
        } catch (error) {
            console.error(error);
            result.textContent = 'The PDF could not be checked. Please try again.';
        } finally {
            fileInput.disabled = false;
            verifyButton.disabled = false;
        }
    });
}

    }

}

</script>

</body>
</html>
