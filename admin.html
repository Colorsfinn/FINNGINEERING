<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FINNGINEERING PROJECT UPLOAD</title>


<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #edf6fa;
            color: #133247;
            font: 16px/1.55 system-ui, sans-serif;
        }

        main {
            width: min(100% - 32px, 600px);
            margin: clamp(16px, 5vw, 32px) auto;
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(1.5rem, 5vw, 2rem);
            line-height: 1.2;
        }

        .upload-fields {
            display: grid;
            gap: 16px;
            padding: clamp(16px, 4vw, 24px);
            border: 1px solid #c9dfe9;
            border-radius: 16px;
            background: #fff;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 650;
        }

        input, button {
            min-height: 44px;
            font: inherit;
        }

        input {
            display: block;
            width: 100%;
            min-width: 0;
            padding: 10px 12px;
            border: 1px solid #658494;
            border-radius: 8px;
            background: #fff;
            color: inherit;
        }

        input[type="file"] {
            padding: 6px;
            text-overflow: ellipsis;
        }

        input::file-selector-button, button {
            padding: 8px 12px;
            border: 1px solid #0c5d7b;
            border-radius: 8px;
            font: inherit;
            font-weight: 650;
            cursor: pointer;
        }

        input::file-selector-button {
            min-height: 44px;
            background: #e7f3f8;
            color: #0c4c65;
        }

        button {
            background: #0c5d7b;
            color: #fff;
        }

        button:disabled { opacity: .55; cursor: default; }
        :focus-visible { outline: 3px solid #0780a8; outline-offset: 2px; }
    </style>
</head>

<body>

<header style="padding: 12px 16px; background: linear-gradient(115deg, #092f49, #116583);">
    <img src="https://colorsfinn.github.io/FINNGINEERING/Finngineering-logo.png"
         alt="Finngineering"
         style="display: block; width: 100%; max-width: 460px; height: auto; margin: 0 auto;">
</header>

<main>
    <h1>Project Upload</h1>

    <form id="sign-in">
        <label for="admin-email">Admin email</label>
        <input id="admin-email" name="email" type="email" autocomplete="email" required>
        <label for="admin-password">Password</label>
                <input id="admin-password" name="password" type="password" autocomplete="current-password">
                <button type="submit">Sign in</button>
                <button id="email-sign-in" type="button">Email me a sign-in link</button>
    </form>
    <button id="sign-out" type="button" hidden>Sign out</button>
    <p id="auth-status" role="status"></p>
            <details id="password-settings" hidden>
                <summary>Set or change password</summary>
                <form id="set-password">
                    <label for="new-admin-password">New password (at least 8 characters)</label>
                    <input id="new-admin-password" name="newPassword" type="password" autocomplete="new-password" minlength="8" required>
                    <button type="submit">Save password</button>
                </form>
                <p id="password-status" role="status"></p>
            </details>
    <section id="admin-tools" hidden>
    <p><a href="./verify.html?admin=1">Verification administration</a></p>
    <div class="upload-fields">
        <div>
            <label for="project_name">Project Name</label>
            <input type="text" id="project_name">
        </div>

        <div>
            <label for="license_number">License Number</label>
            <input type="text" id="license_number">
        </div>

        <div>
            <label for="date_issued">Date Issued</label>
            <input type="date" id="date_issued">
        </div>

        <div>
            <label for="pdf_file">Select PDF</label>
            <input type="file" id="pdf_file" accept=".pdf">
        </div>

        <button type="button" id="save-project-button">Save Project</button>
    </div>

    <div id="qrcode"></div>
    </section>
</main>

<script type="module">



let savedPdfUrl;

function addPdfSaveActions(result, pdf) {
    const downloadLink = result.querySelector('#download-stamped-pdf');
    if (savedPdfUrl) URL.revokeObjectURL(savedPdfUrl);
    savedPdfUrl = URL.createObjectURL(pdf);
    downloadLink.href = savedPdfUrl;
    downloadLink.download = pdf.name;

    const shareButton = result.querySelector('#save-stamped-pdf');
    const status = result.querySelector('#save-pdf-status');
    const shareData = { files: [pdf] };
    const canShare = typeof navigator.share === 'function' && navigator.canShare?.(shareData);
    const canPick = typeof window.showSaveFilePicker === 'function';
    if (!canShare && !canPick) return;

    shareButton.hidden = false;
    shareButton.addEventListener('click', async () => {
        shareButton.disabled = true;
        status.textContent = '';

        try {
            if (canShare) {
                await navigator.share(shareData);
            } else {
                const handle = await window.showSaveFilePicker({
                    suggestedName: pdf.name,
                    types: [{ description: 'PDF document', accept: { 'application/pdf': ['.pdf'] } }]
                });
                const writable = await handle.createWritable();
                await writable.write(pdf);
                await writable.close();
                status.textContent = 'PDF saved.';
            }
        } catch (error) {
            if (error.name !== 'AbortError') {
                status.textContent = 'Could not save or share here. Use Download PDF to save a copy.';
            }
        } finally {
            shareButton.disabled = false;
        }
    });
}

async function stampPdfWithQr(pdfFile, verifyUrl) {

    const pdfBytes = await pdfFile.arrayBuffer();

    const pdfDoc =
        await PDFLib.PDFDocument.load(pdfBytes);

   const qrDataUrl = new window.QRious({
    value: verifyUrl,
    size: 300,
    padding: 24
}).toDataURL();

    const qrBytes =
        await fetch(qrDataUrl)
            .then(r => r.arrayBuffer());

    const qrImage =
        await pdfDoc.embedPng(qrBytes);

    const pages = pdfDoc.getPages();

    const firstPage = pages[0];

    const qrSize = 100;

    firstPage.drawImage(qrImage, {
        x: firstPage.getWidth() - 120,
        y: 20,
        width: qrSize,
        height: qrSize
    });

    const modifiedPdf =
        await pdfDoc.save();

    return new Blob(
        [modifiedPdf],
        { type: 'application/pdf' }
    );
}

import { requireAdmin, supabase } from './auth.js?v=admin-password';

let adminAllowed = false;
requireAdmin((allowed) => {
    adminAllowed = allowed;
    document.querySelector('#admin-tools').hidden = !allowed;
    if (!allowed) {
        document.querySelector('#qrcode').replaceChildren();
        if (savedPdfUrl) URL.revokeObjectURL(savedPdfUrl);
    }
});

window.saveProject = async function() {
  if (!adminAllowed) return;

  const project_name =
    document.getElementById('project_name').value;

  const license_number =
    document.getElementById('license_number').value;

  const date_issued =
    document.getElementById('date_issued').value;

  const pdfFile =
    document.getElementById('pdf_file').files[0];

  if (!pdfFile) {
    alert('Please select a PDF');
    return;
  }

  const fileName =
    Date.now() + '-' + pdfFile.name;

  const { data: publicData } =
    supabase.storage
      .from('project-pdfs')
      .getPublicUrl(fileName);

  const pdf_url =
    publicData.publicUrl;

  const { data, error } =
    await supabase
      .from('projects')
      .insert([
        {
          project_name,
          license_number,
          date_issued,
          pdf_url
        }
      ])
      .select()
      .single();
if (error) {

    alert('Database Error: ' + error.message);

} else {

    const projectId = data.id;

    let verifyUrl =
      new URL('./verify.html?id=' + encodeURIComponent(projectId), location.href).href;
let stampedPdf;
try {
    stampedPdf = await stampPdfWithQr(pdfFile, verifyUrl);

const hashBuffer = await window.crypto.subtle.digest(
    'SHA-256',
    await stampedPdf.arrayBuffer()
);

const pdfHash = Array.from(new Uint8Array(hashBuffer))
    .map(byte => byte.toString(16).padStart(2, '0'))
    .join('');

console.log('Stamped PDF SHA-256:', pdfHash);

    const { error: uploadError } = await supabase.storage
        .from('project-pdfs')
        .upload(fileName, stampedPdf, { contentType: 'application/pdf' });

    if (uploadError) {
        throw uploadError;
    }
const { error: hashError } = await supabase
    .from('projects')
    .update({ hash: pdfHash })
    .eq('id', projectId)
    .select('id')
    .single();

if (hashError) {
    alert('The PDF uploaded, but its hash could not be saved: ' + hashError.message);
    return;
}

} catch (error) {
    console.error(error);
    alert('The project row was created, but the stamped PDF could not be saved. ' + error.message);
    return;
}
  
const qrResult = document.getElementById('qrcode');

qrResult.innerHTML = `
    <section aria-labelledby="qr-result-title" style="
        box-sizing: border-box;
        max-width: 420px;
        margin: 24px 0;
        padding: 24px;
        border: 1px solid #b8d8c9;
        border-radius: 14px;
        background: #f1faf5;
        color: #173a2b;
        font-family: system-ui, sans-serif;
        text-align: center;
    ">
        <h2 id="qr-result-title" style="margin: 0 0 8px; font-size: 22px;">
            Project saved
        </h2>
        <p style="margin: 0 0 16px; line-height: 1.5;">
            The QR code is embedded in your PDF, and a SHA-256 fingerprint
            has been generated.
        </p>
        <canvas role="img" aria-label="Project verification QR code" style="
            display: block;
            margin: 0 auto 12px;
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        "></canvas>
        <div style="display: grid; gap: 8px; margin-bottom: 16px;">
            <button id="save-stamped-pdf" type="button" hidden>Save or share PDF</button>
            <a id="download-stamped-pdf" style="padding: 10px; color: #175c42; font-weight: 650;">
                Download PDF
            </a>
            <div id="save-pdf-status" role="status"></div>
        </div>
        <a id="saved-verify-link" style="color: #175c42; font-weight: 600;">
            Open verification page
        </a>
    </section>
`;

new window.QRious({
    element: qrResult.querySelector('canvas'),
    value: verifyUrl,
    size: 180,
    padding: 16
});

qrResult.querySelector('#saved-verify-link').href = verifyUrl;

const stampedFile = new File(
    [stampedPdf],
    pdfFile.name.replace(/\.pdf$/i, '') + '-verified.pdf',
    { type: 'application/pdf' }
);
addPdfSaveActions(qrResult, stampedFile);


    console.log('Verify URL:', verifyUrl);

  }

};

const saveButton = document.getElementById('save-project-button');

saveButton.addEventListener('click', async () => {
    if (saveButton.disabled) return;

    saveButton.disabled = true;
    saveButton.textContent = 'Saving…';

    try {
        await window.saveProject();
    } finally {
        saveButton.disabled = false;
        saveButton.textContent = 'Save Project';
    }
});

</script>

</body>
</html>
