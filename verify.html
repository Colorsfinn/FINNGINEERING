<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project Verification | Finngineering</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            color: #133247;
            background: #edf6fa;
            font: 16px/1.55 system-ui, sans-serif;
        }

        header {
            padding: 22px 24px;
            background: linear-gradient(115deg, #092f49, #116583);
        }

        .brand {
            display: block;
            max-width: 680px;
            margin: auto;
            color: #fff;
            font-size: 1.5rem;
            font-weight: 750;
            text-decoration: none;
        }

        main {
            width: min(680px, calc(100% - 32px));
            margin: 32px auto;
        }

        h1 { margin: 0 0 20px; line-height: 1.15; }
        h2 { margin: 0 0 12px; font-size: 1.25rem; }

        .card {
            margin-bottom: 16px;
            padding: clamp(18px, 5vw, 28px);
            border: 1px solid #c9dfe9;
            border-radius: 16px;
            background: #fff;
        }

        dl { margin: 0 0 20px; }
        dt { margin-top: 12px; color: #375b6e; font-weight: 650; }
        dd { margin: 2px 0 0; overflow-wrap: anywhere; }

        label { display: block; margin-bottom: 8px; }
        input[type="file"] {
            display: block;
            max-width: 100%;
            margin-bottom: 16px;
            font: inherit;
        }

        .button, input::file-selector-button {
            display: inline-block;
            padding: 10px 16px;
            border: 1px solid #0c5d7b;
            border-radius: 9px;
            background: #0c5d7b;
            color: #fff;
            font: inherit;
            font-weight: 650;
            text-decoration: none;
            cursor: pointer;
        }

        .button.secondary, input::file-selector-button {
            background: #e7f3f8;
            color: #0c4c65;
        }

        input::file-selector-button { margin-right: 8px; }
        .button:disabled { opacity: .55; cursor: default; }
        :focus-visible { outline: 3px solid #0780a8; outline-offset: 3px; }

        #verify_result:empty { display: none; }
        #verify_result {
            margin: 16px 0 0;
            padding: 14px 16px;
            border: 1px solid #c9dfe9;
            border-radius: 10px;
            background: #edf6fa;
            font-weight: 650;
        }

        #verify_result[data-state="verified"] {
            color: #14532d;
            background: #e9f8ef;
            border-color: #8fcea7;
        }

        #verify_result[data-state="mismatch"] {
            color: #8b2028;
            background: #fff0f0;
            border-color: #e2a2a7;
        }
   
    header {
    padding: 12px 16px;
    isolation: isolate;
}

.brand-logo {
    display: block;
    width: min(100%, 540px);
    height: auto;
    margin: 0 auto;
    filter: contrast(1.5);
    mix-blend-mode: screen;
}
    </style>
</head>
<body>
  <header>
    <div class="brand">
        <img class="brand-logo"
             src="./Finngineering-logo.png"
             alt="Finngineering">
    </div>
</header>
  
    <a class="brand" href="https://finngineer.com/">
        <img class="brand-logo"
             src="./Finngineering-logo.png"
             alt="Finngineering">
    </a>
</header>
    </a>
</header> 
    </header>

    <main>
        <h1>Project Verification</h1>

        <section class="card" aria-labelledby="project-details">
            <h2 id="project-details">Project details</h2>
            <dl>
                <dt>Project name</dt>
                <dd id="project_name"></dd>
                <dt>License number</dt>
                <dd id="license_number"></dd>
                <dt>Date issued</dt>
                <dd id="date_issued"></dd>
            </dl>
            <a id="pdf_link" class="button secondary"
               target="_blank" rel="noopener">View PDF</a>
        </section>

        <section class="card" aria-labelledby="verify-heading">
            <h2 id="verify-heading">Verify a PDF</h2>
            <label for="verify_pdf">Choose the PDF you want to check.</label>
            <input id="verify_pdf" type="file" accept=".pdf,application/pdf">
            <button id="verify_button" class="button" type="button" disabled>
                Verify PDF
            </button>
            <p id="verify_result" role="status" aria-atomic="true"></p>
        </section>
    </main>
<script type="module">

import { createClient }
from 'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(
'https://lyavctuwlyegrnfwqgez.supabase.co',
'sb_publishable_-z5-3a45iAHLC6-cY2UR_w_nz-RB095'
);

const params =
  new URLSearchParams(window.location.search);

const projectId =
  params.get('id');

if(projectId){

    const { data, error } =
      await supabase
        .from('projects')

        .select('project_name, license_number, date_issued, pdf_url, hash')
        .eq('id', projectId)
        .single();

    if(error){

        document.body.innerHTML =
          '<h2>Project Not Found</h2>';

    } else {

        document.getElementById(
          'project_name'
        ).textContent =
          data.project_name;

        document.getElementById(
          'license_number'
        ).textContent =
          data.license_number;

        document.getElementById(
          'date_issued'
        ).textContent =
          data.date_issued;

        document.getElementById(
          'pdf_link'
        ).href =
          data.pdf_url;

const fileInput = document.getElementById('verify_pdf');
const verifyButton = document.getElementById('verify_button');
const result = document.getElementById('verify_result');
const expectedHash = (data.hash ?? '').trim().toLowerCase();

if (!/^[a-f0-9]{64}$/.test(expectedHash)) {
    result.textContent = 'There is no valid SHA-256 fingerprint on file for this project.';
} else {
    fileInput.addEventListener('change', () => {
        result.textContent = '';
        verifyButton.disabled = !fileInput.files.length;
    });

    verifyButton.addEventListener('click', async () => {
        const file = fileInput.files[0];
        if (!file) return;

        verifyButton.disabled = true;
        fileInput.disabled = true;
        result.textContent = 'Checking your PDF…';

        try {
            const digest = await window.crypto.subtle.digest(
                'SHA-256',
                await file.arrayBuffer()
            );
            const actualHash = Array.from(new Uint8Array(digest))
                .map(byte => byte.toString(16).padStart(2, '0'))
                .join('');

            result.textContent = actualHash === expectedHash
                ? 'Verified. This PDF matches the file saved for this project.'
                : 'The PDF does not match the file saved for this project.';
        } catch (error) {
            console.error(error);
            result.textContent = 'The PDF could not be checked. Please try again.';
        } finally {
            fileInput.disabled = false;
            verifyButton.disabled = false;
        }
    });
}

    }

}

</script>

</body>
</html>
