<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project Verification | Finngineering</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            color: #133247;
            background: #edf6fa;
            font: 16px/1.55 system-ui, sans-serif;
        }

        header {
            padding: 22px 24px;
            background: linear-gradient(115deg, #092f49, #116583);
        }

        .brand {
            display: block;
            max-width: 680px;
            margin: auto;
            color: #fff;
            font-size: 1.5rem;
            font-weight: 750;
            text-decoration: none;
        }
        main {
            width: min(680px, calc(100% - 32px));
            margin: 32px auto;
        }

        h1 { margin: 0 0 20px; line-height: 1.15; }
        h2 { margin: 0 0 12px; font-size: 1.25rem; }

        .card {
            margin-bottom: 16px;
            padding: clamp(18px, 5vw, 28px);
            border: 1px solid #c9dfe9;
            border-radius: 16px;
            background: #fff;
        }

        dl { margin: 0 0 20px; }
        dt { margin-top: 12px; color: #375b6e; font-weight: 650; }
        dd { margin: 2px 0 0; overflow-wrap: anywhere; }

        label { display: block; margin-bottom: 8px; }
        input[type="file"] {
            display: block;
            max-width: 100%;
            margin-bottom: 16px;
            font: inherit;
        }

        .button, input::file-selector-button {
            display: inline-block;
            padding: 10px 16px;
            border: 1px solid #0c5d7b;
            border-radius: 9px;
            background: #0c5d7b;
            color: #fff;
            font: inherit;
            font-weight: 650;
            text-decoration: none;
            cursor: pointer;
        }

        .button.secondary, input::file-selector-button {
            background: #e7f3f8;
            color: #0c4c65;
        }

        input::file-selector-button { margin-right: 8px; }
        #pdf_link[hidden] { display: none; }
        .button:disabled { opacity: .55; cursor: default; }
        :focus-visible { outline: 3px solid #0780a8; outline-offset: 3px; }

        .verification-result:empty { display: none; }
        .verification-result {
            margin: 16px 0 0;
            padding: 14px 16px;
            border: 1px solid #c9dfe9;
            border-radius: 10px;
            background: #edf6fa;
            font-weight: 650;
        }

        .verification-result[data-state="verified"] {
            color: #14532d;
            background: #e9f8ef;
            border-color: #8fcea7;
        }

        .verification-result[data-state="mismatch"] {
            color: #8b2028;
            background: #fff0f0;
            border-color: #e2a2a7;
        }
   
    header {
    padding: 12px 16px;
    isolation: isolate;
}

.brand-logo {
    display: block;
    width: min(100%, 540px);
    height: auto;
    margin: 0 auto;
    filter: contrast(1.5);
    mix-blend-mode: screen;
}
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <img src="./Finngineering-logo.png"
                 alt="Finngineering"
                 style="display: block; width: 100%; max-width: 460px; height: auto; margin: 0 auto;">
        </div>
    </header>

    <main>
        <h1>Project Verification</h1>
        <section id="public-check" class="card" hidden>
            <p>Choose the PDF you received to check whether it matches the original.</p>
            <form id="check-public-pdf" novalidate>
                <label for="public-pdf">PDF file</label>
                <input id="public-pdf" name="pdf" type="file" accept=".pdf,application/pdf">
                <button class="button" type="submit">Check this PDF</button>
            </form>
        </section>
        <p id="verify_result" class="verification-result" role="status" aria-atomic="true"></p>
        <section id="admin-login" class="card" hidden>
            <form id="sign-in">
                <label for="admin-email">Admin email</label>
                <input id="admin-email" name="email" type="email" autocomplete="email" required>
                <label for="admin-password">Password</label>
                <input id="admin-password" name="password" type="password" autocomplete="current-password">
                <button type="submit">Sign in</button>
                <button id="email-sign-in" type="button">Email me a sign-in link</button>
            </form>
            <button id="sign-out" type="button" hidden>Sign out</button>
            <p id="auth-status" role="status"></p>
            <details id="password-settings" hidden>
                <summary>Set or change password</summary>
                <form id="set-password">
                    <label for="new-admin-password">New password (at least 8 characters)</label>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <input id="new-admin-password" name="newPassword" type="password" autocomplete="new-password" minlength="8" required>
                        <button id="toggle-password" type="button" aria-label="Show password" aria-controls="new-admin-password" aria-pressed="false" style="min-width: 44px; min-height: 44px;">
                            <span aria-hidden="true">👁</span>
                        </button>
                    </div>
                    <button type="submit">Save password</button>
                </form>
                <p id="password-status" role="status"></p>
            </details>
        </section>
        <section id="admin-tools" hidden>
            <section class="card">
                <h2>Find a project</h2>
                <form id="lookup">
                    <label for="project-search-field">Search by</label>
                    <select id="project-search-field" name="field">
                        <option value="license_number">License number</option>
                        <option value="project_name">Project name</option>
                    </select>
                    <label for="project-search">License number or project name</label>
                    <input id="project-search" name="query" required>
                    <button class="button" type="submit">Search</button>
                </form>
                <ul id="project-results" aria-label="Matching projects"></ul>
                <form id="verify-file">
                    <label for="verify_pdf">Find a project by stamped PDF</label>
                    <input id="verify_pdf" name="pdf" type="file" accept=".pdf,application/pdf" required>
                    <button class="button" type="submit">Check PDF</button>
                </form>
                <p id="lookup-status" class="verification-result" role="status" aria-atomic="true"></p>
            </section>
            <section id="details" class="card" hidden>
                <h2>Project details</h2>
                <dl>
                    <dt>Project name</dt><dd id="project_name"></dd>
                    <dt>License number</dt><dd id="license_number"></dd>
                    <dt>Date issued</dt><dd id="date_issued"></dd>
                </dl>
                <button id="open-pdf" class="button" type="button">Get PDF link</button>
                <a id="pdf-link" target="_blank" rel="noopener" hidden>Open PDF</a>
                <button id="save-view" class="button" type="button">Save view</button>
                <p id="detail-status" role="status"></p>
            </section>
            <section class="card">
                <h2>Saved views</h2>
                <ul id="saved-views"></ul>
                <p id="saved-status" role="status"></p>
            </section>
            <section class="card">
                <h2>Grant administrator access</h2>
                <form id="grant-admin">
                    <label for="new-admin-email">Email address</label>
                    <input id="new-admin-email" name="email" type="email" required>
                    <button class="button" type="submit">Grant access</button>
                </form>
                <p id="grant-status" role="status"></p>
            </section>
            <a href="./admin.html">Project Upload</a>
        </section>
    </main>
    <script type="module" src="./verify.js?v=clear-admin-pdf"></script>
</body>
</html>
